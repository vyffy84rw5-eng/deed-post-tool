<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DEED 投稿ツール | 連携</title>
<style>body{font-family:-apple-system,"Hiragino Sans",sans-serif;max-width:720px;margin:40px auto;padding:0 16px;line-height:1.8;color:#222;background:#fff}code{background:#f3f3f3;padding:2px 6px;border-radius:4px;word-break:break-all}</style></head><body>
<h1>TikTok連携</h1>
<p id="msg">連携の応答を確認しています…</p>
<script>
const q=new URLSearchParams(location.search);const code=q.get("code"),err=q.get("error"),state=q.get("state");
const m=document.getElementById("msg");
if(err){m.textContent="連携は許可されませんでした（"+err+"）。この画面を閉じてください。";}
else if(code){m.innerHTML="連携コードを受け取りました。このコードを担当者に伝えてください。<br><code>"+code+"</code>"+(state?"<br>state: <code>"+state+"</code>":"");}
else{m.textContent="このページは、TikTokの連携画面から戻ってきたときに使うものです。";}
</script>
</body></html>
